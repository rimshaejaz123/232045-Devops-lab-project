name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Angular App
        working-directory: ./frontend
        # Yeh base-href aapke repo ke naam ke hisaab se hai
        run: npx ng build --configuration production --base-href /232045-Devops-lab-project/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Angular 17+ mein build path yeh hota hai
          path: './frontend/dist/frontend/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4